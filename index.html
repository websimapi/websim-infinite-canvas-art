<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Canvas Art</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <div id="loading">
            <div class="loading-text">Loading Infinite Canvas...</div>
            <div class="loading-spinner"></div>
        </div>
        <div id="controls" class="hidden">
            <div class="tools">
                <button id="brush" class="tool active" title="Brush">
                    <svg viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/></svg>
                </button>
                <input type="color" id="color-picker" value="#000000">
                <div class="brush-size">
                    <input type="range" id="brush-size" min="1" max="50" value="5">
                </div>
            </div>
            <div class="navigation">
                <button id="reset-view" title="Reset View">
                    <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                </button>
            </div>
            <div class="status">
                <div id="online-users">0 online</div>
            </div>
        </div>
        <canvas id="canvas"></canvas>
        <div id="start-prompt" class="visible">
            <button id="start-button">Click to Start</button>
        </div>
        <div id="minimap-container">
            <canvas id="minimap"></canvas>
        </div>
        <div id="coordinates">0, 0</div>
        <audio id="background-music" loop>
            <source src="/Ambient Waves - Track 1 - Sonauto.wav" type="audio/wav">
        </audio>
    </div>
    <script src="app.js" type="module"></script>

</body>
</html>
